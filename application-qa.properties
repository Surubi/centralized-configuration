# Application name
spring.application.name=qa

# DataSource configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/qa
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update   # options: none, validate, update, create, create-drop
spring.jpa.show-sql=true               # show SQL in logs
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=qa
